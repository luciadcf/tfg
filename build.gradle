// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        kotlin_version = '2.0.20'
        gradle_version = '8.7.3'

        androidx_core_ktx_version = '1.15.0'
        androidx_navigation_version = '2.8.5'
        androidx_appcompat_version = '1.7.0'
        androidx_constraintlayout_version = '2.2.0'
        androidx_test_runner_version = '1.2.0'
        androidx_espresso_core_version = '3.2.0'
        androidx_room_version = '2.6.1'
        androidx_fragment_version = '1.2.1'
        androidx_drawerlayout_version = '1.0.0'

        firebase_database_version = '21.0.0'
        firebase_analytics_version = '22.1.2'
        firebase_auth_version = '23.1.0'
        firebase_messaging_version = '24.1.0'

        google_services_version = '4.4.2'
        google_playservices_maps_version = '19.0.0'
        google_playservices_location_version = '21.3.0'
        google_material_version = '1.12.0'

        koin_version = '4.0.0'

        paypal_version = '2.16.0'

        security_version = '1.1.0-alpha06'

        gson_version = "2.10.1"

        retrofit_version = "2.9.0"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        classpath "com.google.gms:google-services:$google_services_version"
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
